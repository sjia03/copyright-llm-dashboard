<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --section-bg: #f7f7f5;
    --card-bg: #ffffff;
    --border: rgba(55,53,47,0.09);
    --border-strong: rgba(55,53,47,0.16);
    --text-primary: rgba(55,53,47,0.92);
    --text-secondary: rgba(55,53,47,0.65);
    --text-muted: rgba(55,53,47,0.45);
    --pill-blue-bg: #e7f3f8; --pill-blue-text: #0b6e99;
    --pill-green-bg: #edf3ec; --pill-green-text: #448361;
    --pill-gray-bg: #f1f1ef; --pill-gray-text: #787774;
    --pill-amber-bg: #fbf3db; --pill-amber-text: #9f6b00;
    --code-bg: rgba(135,131,120,0.15);
    --accent: #2382c9;
    --row-stripe: rgba(135,131,120,0.05);
    --featured-bg: rgba(35,130,201,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #191919;
      --section-bg: #202020;
      --card-bg: #252525;
      --border: rgba(255,255,255,0.094);
      --border-strong: rgba(255,255,255,0.16);
      --text-primary: rgba(255,255,255,0.90);
      --text-secondary: rgba(255,255,255,0.65);
      --text-muted: rgba(255,255,255,0.42);
      --pill-blue-bg: rgba(46,170,220,0.16); --pill-blue-text: #6dc4e8;
      --pill-green-bg: rgba(68,131,97,0.18); --pill-green-text: #7cc99a;
      --pill-gray-bg: rgba(255,255,255,0.08); --pill-gray-text: rgba(255,255,255,0.6);
      --pill-amber-bg: rgba(159,107,0,0.2); --pill-amber-text: #e0b04a;
      --code-bg: rgba(255,255,255,0.08);
      --accent: #3987e5;
      --row-stripe: rgba(255,255,255,0.03);
      --featured-bg: rgba(57,135,229,0.14);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 32px 24px 72px; }

  h1 { font-size: 25px; font-weight: 700; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 26px; flex-wrap: wrap; }
  .tab-btn {
    appearance: none; background: none; border: none; font: inherit; font-size: 14px; font-weight: 600;
    color: var(--text-muted); padding: 8px 14px 10px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text-secondary); }
  .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--accent); }
  .tab-panel[hidden] { display: none; }

  section.block { margin-bottom: 34px; }
  section.block h2 {
    font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-secondary); margin: 0 0 10px;
  }
  .block-note { font-size: 12.5px; color: var(--text-muted); margin: 8px 2px 0; line-height: 1.5; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em;
    color: var(--text-muted); font-weight: 600; padding: 8px 10px; background: var(--section-bg);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-stripe); }
  .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .muted { color: var(--text-muted); }
  .sec-label { color: var(--text-secondary); }

  .pill { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
  .pill.complete { background: var(--pill-green-bg); color: var(--pill-green-text); }
  .pill.in-progress, .pill.partial { background: var(--pill-blue-bg); color: var(--pill-blue-text); }
  .pill.not-run { background: var(--pill-gray-bg); color: var(--pill-gray-text); }
  .pill.tier { background: var(--pill-amber-bg); color: var(--pill-amber-text); }

  .genre-dropdown {
    display: block; margin-top: 5px; font: inherit; font-size: 12px;
    color: var(--text-secondary); background: var(--section-bg);
    border: 1px solid var(--border-strong); border-radius: 5px;
    padding: 3px 6px; max-width: 260px;
  }

  tr.featured-row td { background: var(--featured-bg); }
  tr.featured-row:nth-child(even) td { background: var(--featured-bg); }

  .coef-cell { line-height: 1.3; }
  .coef-cell .coef { font-weight: 600; }
  .coef-cell .se { font-size: 11px; color: var(--text-muted); }
  .coef-cell .na { color: var(--text-muted); font-style: italic; font-weight: 400; }

  .loading, .error { padding: 40px 0; text-align: center; color: var(--text-muted); font-size: 14px; }
  .error { color: var(--pill-amber-text); }

  .callout {
    background: var(--pill-amber-bg); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 12px 16px; font-size: 13px; line-height: 1.55; color: var(--text-primary); margin-bottom: 24px;
  }
  .callout b { color: var(--pill-amber-text); }
  .outcome-head { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
  .sign-hint { font-size: 11px; font-weight: 400; color: var(--text-muted); display: block; }

  .outcome-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
    background: var(--card-bg); font-size: 13px; line-height: 1.55;
  }
  .outcome-card h3 { font-size: 12.5px; font-weight: 700; margin: 0 0 6px; color: var(--text-secondary); }
  .eqn-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
    background: var(--card-bg);
  }
  .eqn-card h3 { font-size: 12.5px; font-weight: 700; margin: 0 0 8px; color: var(--text-secondary); }
  .eqn-formula {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; color: var(--text-primary);
    background: var(--section-bg); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
    overflow-x: auto; white-space: nowrap;
  }
  .eqn-note { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; }

  .stats-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .stats-groups { grid-template-columns: 1fr; } }
  .stats-groups h3 { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin: 0 0 6px; }
  .cat-row td { font-weight: 600; background: var(--section-bg); color: var(--text-secondary); font-size: 11.5px; }
</style>

const TASKS = [
  { id: "name-cloze", label: "Name Cloze" },
  { id: "concept-test", label: "Concept Test" },
  { id: "character-test", label: "Character Test" },
  { id: "text-extraction", label: "Text Extraction" },
  { id: "books3-demand", label: "Books3 Demand" },
];

// Main models of interest — covers every naming variant used across tasks
// (e.g. name-cloze's "gpt-3.5" vs concept/character-test's "gpt-3.5-turbo").
// Rows for these models sort to the top of each results table and get a
// light highlight; everything else (pilot/one-off models like claude-opus-4-8,
// gpt-5.5, claude-sonnet-5) stays below, unhighlighted.
const MAIN_MODELS = new Set([
  "gpt-3.5", "gpt-3.5-turbo",
  "gpt-4o",
  "claude (legacy)", "claude-3-haiku",
  "gemini (legacy)",
  "llama-3-8b", "llama-3.1-8b",
  "llama-3-70b", "llama-3.1-70b",
  "claude-haiku-4.5",
  "deepseek-v4-pro",
  "gpt-5.4-mini",
  "gemini-3.1-flash-lite",
]);
function isFeatured(model) { return MAIN_MODELS.has(model); }
function sortFeaturedFirst(results) {
  return results
    .map((r, i) => ({ r, i }))
    .sort((a, b) => (isFeatured(b.r.model) - isFeatured(a.r.model)) || (a.i - b.i))
    .map(x => x.r);
}

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
const loaded = new Set();

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function fmtNum(n) {
  if (n == null) return '—';
  return n.toLocaleString();
}

function statusPill(status) {
  if (!status) return '';
  const cls = status.toLowerCase().includes('progress') ? 'in-progress'
    : status.toLowerCase().includes('partial') ? 'partial'
    : status.toLowerCase().includes('not-run') ? 'not-run'
    : 'complete';
  return `<span class="pill ${cls}">${esc(status)}</span>`;
}

TASKS.forEach((t, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
  btn.textContent = t.label;
  btn.dataset.task = t.id;
  btn.addEventListener('click', () => selectTab(t.id));
  tabsEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tab-panel';
  panel.id = 'panel-' + t.id;
  panel.hidden = i !== 0;
  panel.innerHTML = '<div class="loading">Loading…</div>';
  panelsEl.appendChild(panel);
});

function selectTab(taskId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.task === taskId));
  document.querySelectorAll('.tab-panel').forEach(p => p.hidden = p.id !== 'panel-' + taskId);
  if (!loaded.has(taskId)) loadTask(taskId);
}

function loadTask(taskId) {
  loaded.add(taskId);
  const panel = document.getElementById('panel-' + taskId);
  const data = SNAPSHOT_DATA[taskId];
  if (!data) {
    panel.innerHTML = `<div class="error">No snapshot data for this tab.</div>`;
    loaded.delete(taskId);
    return;
  }
  try {
    panel.innerHTML = renderTask(taskId, data);
  } catch (e) {
    panel.innerHTML = `<div class="error">Render error: ${esc(String(e))}</div>`;
  }
}

function genreDropdown(genres) {
  if (!genres || !genres.length) return '';
  const options = genres.map(g => `<option>${esc(g)}</option>`).join('');
  return `<select class="genre-dropdown" title="Genre tags excluded by this filter">
    <option selected disabled>${genres.length} excluded genres ▾</option>
    ${options}
  </select>`;
}

function renderFunnel(funnel) {
  const rows = funnel.map(f => `
    <tr>
      <td>${esc(f.step)}${genreDropdown(f.excluded_genres)}</td>
      <td class="num sec-label">${esc(f.remaining)}</td>
      <td class="muted">${esc(f.filter_type)}</td>
      <td>${esc(f.why)}</td>
    </tr>`).join('');
  return `
    <section class="block">
      <h2>Filtering pipeline</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Step</th><th>Remaining</th><th>Filter type</th><th>Why it matters for the paper</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>`;
}

function specCell(spec) {
  if (!spec) return '<span class="na">—</span>';
  const se = spec.se != null ? `(${spec.se.toFixed(4)})` : '';
  const f = spec.fstat != null ? `<br><span class="se">F=${spec.fstat.toFixed(1)}</span>` : '';
  return `<span class="coef">${spec.coef.toFixed(4)}${esc(spec.stars)}</span><br><span class="se">${se}</span>${f}`;
}

function renderRegressionRow(labelCells, regressions, rowClass) {
  const cls = rowClass ? ` class="${rowClass}"` : '';
  if (!regressions.ok) {
    return `<tr${cls}>${labelCells}<td class="muted" colspan="5">not enough data (${esc(regressions.reason)})</td></tr>`;
  }
  const byLabel = {};
  regressions.specs.forEach(s => byLabel[s.label] = s);
  const n = regressions.specs[0] ? regressions.specs[0].n : null;
  return `<tr${cls}>${labelCells}
    <td class="num">${fmtNum(n)}</td>
    <td class="coef-cell">${specCell(byLabel['OLS'])}</td>
    <td class="coef-cell">${specCell(byLabel['IV'])}</td>
    <td class="coef-cell">${specCell(byLabel['IV + pop FE'])}</td>
    <td class="coef-cell">${specCell(byLabel['IV + pop FE + controls'])}</td>
  </tr>`;
}

function renderResultsAndRegressions(taskId, data) {
  let head, rows;
  const results = sortFeaturedFirst(data.results);
  if (taskId === 'name-cloze') {
    head = `<th>Model</th><th>Tier</th><th>Status</th><th>Books</th><th>Items</th><th>N (reg.)</th><th>OLS</th><th>IV</th><th>IV + pop FE</th><th>IV + pop FE + ctrl</th>`;
    rows = results.map(r => {
      const labelCells = `<td>${esc(r.model)}</td><td><span class="pill tier">${esc(r.tier)}</span></td><td>${statusPill(r.status)}</td>
        <td class="num">${fmtNum(r.n_books)}</td><td class="num">${fmtNum(r.n_items)}</td>`;
      return renderRegressionRow(labelCells, r.regressions, isFeatured(r.model) ? 'featured-row' : '');
    }).join('');
  } else {
    const outcomeKey = taskId === 'text-extraction' ? 'metrics' : 'outcomes';
    const outcomeLabel = taskId === 'text-extraction' ? 'Metric' : 'Outcome';
    head = `<th>Model</th><th>${outcomeLabel}</th><th>Status</th><th>Books</th><th>Items</th><th>N (reg.)</th><th>OLS</th><th>IV</th><th>IV + pop FE</th><th>IV + pop FE + ctrl</th>`;
    rows = results.flatMap(r => {
      const items = r[outcomeKey] || [];
      const rowClass = isFeatured(r.model) ? 'featured-row' : '';
      const cls = rowClass ? ` class="${rowClass}"` : '';
      if (items.length === 0) {
        return [`<tr${cls}><td>${esc(r.model)}</td><td class="muted" colspan="9">${statusPill(r.status)}</td></tr>`];
      }
      return items.map((o, idx) => {
        const labelCells = `${idx === 0 ? `<td rowspan="${items.length}">${esc(r.model)}</td>` : ''}
          <td>${esc(o.outcome || o.metric)}</td><td>${statusPill(r.status)}</td>
          <td class="num">${fmtNum(o.n_books)}</td><td class="num">${fmtNum(o.n_items)}</td>`;
        return renderRegressionRow(labelCells, o.regressions, rowClass);
      });
    });
    rows = rows.join('');
  }
  return `
    <section class="block">
      <h2>Raw results &amp; regressions</h2>
      <div class="table-wrap">
        <table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
      </div>
      <div class="block-note">Regression spec ladder: (1) OLS score ~ books3. (2) IV: books3 instrumented by shares (books3's publication-year composition). (3) adds popularity-bucket fixed effects. (4) adds num_reviews / num_ratings / avg_rating controls. Robust (HC1) SEs throughout; stars: * p&lt;.10, ** p&lt;.05, *** p&lt;.01.</div>
    </section>`;
}

function renderSummaryStatsGroup(title, rows) {
  if (!rows || rows.length === 0) return `<div><h3>${esc(title)}</h3><div class="muted" style="font-size:12.5px;">No books in this scope.</div></div>`;
  let lastCat = null;
  const trs = rows.map(r => {
    const catRow = r.category !== lastCat ? `<tr class="cat-row"><td colspan="3">${esc(r.category)}</td></tr>` : '';
    lastCat = r.category;
    return catRow + `<tr><td>${esc(r.trait)}</td><td class="num">${fmtNum(r.n)}</td><td class="num">${r.pct}%</td></tr>`;
  }).join('');
  return `<div><h3>${esc(title)}</h3>
    <div class="table-wrap"><table><thead><tr><th>Trait</th><th>N</th><th>%</th></tr></thead><tbody>${trs}</tbody></table></div>
  </div>`;
}

function renderSummaryStats(summaryStats) {
  const titleMap = {
    full_corpus_n12916: 'Full corpus (12,916 books)',
    restricted_sample_n494: 'Restricted sample (494 books)',
    current_sample: 'Current sample',
    full_bank: 'Full bank',
    matched_sample_n8124: 'Matched checkout sample (8,124 books)',
  };
  const groups = Object.entries(summaryStats).map(([key, rows]) => renderSummaryStatsGroup(titleMap[key] || key, rows)).join('');
  return `
    <section class="block">
      <h2>Sample summary statistics</h2>
      <div class="stats-groups">${groups}</div>
    </section>`;
}

function starsFor(p) {
  if (p == null) return '';
  return p < 0.01 ? '***' : p < 0.05 ? '**' : p < 0.10 ? '*' : '';
}

function demandCell(cell) {
  if (!cell) return '<span class="na">—</span>';
  const stars = starsFor(cell.p);
  const seLine = `<span class="se">(${cell.se.toFixed(4)})</span>`;
  const fLine = cell.f_stat != null ? `<br><span class="se">F=${cell.f_stat.toFixed(1)}</span>` : '';
  const ciLine = cell.ci_lower != null
    ? `<br><span class="se">95% CI [${cell.ci_lower.toFixed(4)}, ${cell.ci_upper.toFixed(4)}]</span>` : '';
  const nLine = cell.n_books != null ? `<br><span class="se">N=${fmtNum(cell.n_books)}</span>` : '';
  return `<span class="coef">${cell.coef >= 0 ? '+' : ''}${cell.coef.toFixed(4)}${esc(stars)}</span><br>${seLine}${fLine}${ciLine}${nLine}`;
}

function renderMethodology(data) {
  const outcomes = (data.outcomes || []).map(o => `
    <div class="outcome-card">
      <h3>${esc(o.source)}</h3>
      <div>${esc(o.text)}</div>
    </div>`).join('');
  // equation/note fields contain deliberate HTML (sub/sup/entities), authored
  // in research_manifest.py, not user input -- injected directly, not esc()'d.
  const equations = (data.equations || []).map(e => `
    <div class="eqn-card">
      <h3>${esc(e.label)}</h3>
      <div class="eqn-formula">${e.equation}</div>
      <div class="eqn-note">${e.note}</div>
    </div>`).join('');
  if (!outcomes && !equations) return '';
  return `
    <section class="block">
      <h2>How the outcome variable was constructed</h2>
      ${outcomes}
    </section>
    <section class="block">
      <h2>Regression equations</h2>
      ${equations}
    </section>`;
}

function renderDemandComparison(data) {
  if (data.error) {
    return `<div class="error">${esc(data.error)}</div>`;
  }
  const rows = (data.comparison || []).map(r => `
    <tr>
      <td>${esc(r.spec)}</td>
      <td class="coef-cell">${demandCell(r.keepa)}</td>
      <td class="coef-cell">${demandCell(r.checkout)}</td>
    </tr>`).join('');
  return `
    ${data.headline ? `<div class="callout"><b>Headline:</b> ${esc(data.headline)}</div>` : ''}
    <section class="block">
      <h2>Keepa sales rank vs. SPL checkout demand</h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Estimator</th>
            <th class="outcome-head">Keepa (sales rank)<span class="sign-hint">+ = sells worse post-ChatGPT</span></th>
            <th class="outcome-head">SPL checkouts<span class="sign-hint">+ = more checkouts post-ChatGPT</span></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="block-note">Robust/clustered SEs throughout (by book for panel specs, HC1/robust for cross-sectional). Stars: * p&lt;.10, ** p&lt;.05, *** p&lt;.01. CS-DiD ATT has no p-value column -- read significance off the 95% CI instead.</div>
    </section>`;
}

function renderTask(taskId, data) {
  if (taskId === 'books3-demand') {
    const note = data.note;
    return [
      renderFunnel(data.funnel || []),
      note ? `<div class="block-note" style="margin:-24px 0 24px;">${esc(note)}</div>` : '',
      renderSummaryStats(data.summary_stats || {}),
      renderMethodology(data),
      renderDemandComparison(data),
    ].join('');
  }
  const note = data.note || data.excluded_note;
  return [
    renderFunnel(data.funnel || []),
    note ? `<div class="block-note" style="margin:-24px 0 24px;">${esc(note)}</div>` : '',
    renderSummaryStats(data.summary_stats || {}),
    renderResultsAndRegressions(taskId, data),
  ].join('');
}

selectTab(TASKS[0].id);
</script>
